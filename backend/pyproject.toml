[project]
name = "schedulesim-backend"
version = "1.0.0"
description = "ScheduleSim backend: project-management view over the ARLS-PPO thesis code"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.0", "uvicorn==0.40.0"]

[project.optional-dependencies]
test = ["pytest", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
